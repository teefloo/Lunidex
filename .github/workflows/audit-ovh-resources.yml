name: Audit OVH VPS resources

on:
  workflow_dispatch:
    inputs:
      confirm_read_only_inspection:
        description: Run a read-only RAM, CPU, disk, container, and timer inspection
        required: true
        default: false
        type: boolean
      manual_audit_slot:
        description: Select the missed scheduled slot when manually replacing an audit
        required: false
        default: adhoc
        type: choice
        options:
          - adhoc
          - 2026-11-21-19-06-utc
          - 2026-11-22-13-06-utc
          - 2026-11-23-13-06-utc
      expected_heap_sample_run_id:
        description: Optional run ID for the sanitized heap summary, memory series, and matching route-family counts (digits-digits)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ovh-vps-resource-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/codex/ovh-vps-migration' || github.ref == 'refs/heads/master') &&
      inputs.confirm_read_only_inspection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ovh-preproduction
    outputs:
      audit_slot: ${{ steps.slot.outputs.audit_slot }}
      audit_utc_date: ${{ steps.slot.outputs.audit_utc_date }}
      audit_date_valid: ${{ steps.slot.outputs.audit_date_valid }}
      audit_date_error: ${{ steps.slot.outputs.audit_date_error }}
      container_status: ${{ steps.host.outputs.audit_container_status }}
      container_health: ${{ steps.host.outputs.audit_container_health }}
      container_started_at: ${{ steps.host.outputs.audit_container_started_at }}
      restart_count: ${{ steps.host.outputs.audit_restart_count }}
      container_oom_killed: ${{ steps.host.outputs.audit_container_oom_killed }}
      log_capture_available: ${{ steps.host.outputs.audit_log_capture_available }}
      v8_heap_oom: ${{ steps.host.outputs.audit_v8_heap_oom }}
      node_fatal: ${{ steps.host.outputs.audit_node_fatal }}
      docker_cpu_pct: ${{ steps.host.outputs.audit_docker_cpu_pct }}
      host_ram_available_bytes: ${{ steps.host.outputs.audit_host_ram_available_bytes }}
      root_fs_free_bytes: ${{ steps.host.outputs.audit_root_fs_free_bytes }}
      cgroup_current_bytes: ${{ steps.diagnostics.outputs.app_cgroup_memory_current_bytes }}
      cgroup_peak_bytes: ${{ steps.diagnostics.outputs.app_cgroup_memory_peak_bytes }}
      cgroup_anon_bytes: ${{ steps.diagnostics.outputs.app_cgroup_memory_stat_anon_bytes }}
      cgroup_file_bytes: ${{ steps.diagnostics.outputs.app_cgroup_memory_stat_file_bytes }}
      cgroup_inactive_file_bytes: ${{ steps.diagnostics.outputs.app_cgroup_memory_stat_inactive_file_bytes }}
      cgroup_slab_bytes: ${{ steps.diagnostics.outputs.app_cgroup_memory_stat_slab_bytes }}
      cgroup_kernel_bytes: ${{ steps.diagnostics.outputs.app_cgroup_memory_stat_kernel_bytes }}
      memory_captured_at: ${{ steps.diagnostics.outputs.audit_memory_captured_at }}
      cgroup_event_max: ${{ steps.diagnostics.outputs.app_cgroup_memory_event_max }}
      cgroup_oom: ${{ steps.diagnostics.outputs.app_cgroup_memory_event_oom }}
      cgroup_oom_kill: ${{ steps.diagnostics.outputs.app_cgroup_memory_event_oom_kill }}
      cgroup_oom_group_kill: ${{ steps.diagnostics.outputs.app_cgroup_memory_event_oom_group_kill }}
      node_rss_kib: ${{ steps.diagnostics.outputs.app_host_runtime_1_vmrss_kib }}
      node_cpu_pct: ${{ steps.diagnostics.outputs.app_host_runtime_1_cpu_pct }}
      caddy_access_logs_available: ${{ steps.diagnostics.outputs.caddy_access_logs_available }}
      healthz_status: ${{ steps.https.outputs.healthz_status }}
      home_status: ${{ steps.https.outputs.home_status }}
      tcg_status: ${{ steps.https.outputs.tcg_status }}
      manifest_status: ${{ steps.https.outputs.manifest_status }}
      service_worker_status: ${{ steps.https.outputs.service_worker_status }}
      auth_session_status: ${{ steps.https.outputs.auth_session_status }}
      profile_status: ${{ steps.https.outputs.profile_status }}
      tls_verify_result: ${{ steps.https.outputs.tls_verify_result }}
    env:
      OVH_DEPLOY_HOST: ${{ vars.OVH_DEPLOY_HOST }}
      OVH_DEPLOY_USER: ${{ vars.OVH_DEPLOY_USER }}
      OVH_DEPLOY_KNOWN_HOSTS: ${{ vars.OVH_DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate audit slot against runner UTC date
        id: slot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ''
          MANUAL_AUDIT_SLOT: ${{ inputs.manual_audit_slot || 'adhoc' }}
        run: |
          set -Eeuo pipefail
          RUNNER_UTC_DATE="$(date -u +%F)"
          resolution="$(EVENT_NAME="$EVENT_NAME" \
            EVENT_SCHEDULE="$EVENT_SCHEDULE" \
            MANUAL_AUDIT_SLOT="$MANUAL_AUDIT_SLOT" \
            RUNNER_UTC_DATE="$RUNNER_UTC_DATE" \
            python3 scripts/deployment/resolve_ovh_audit_slot.py)"
          printf '%s\n' "$resolution" | tee -a "$GITHUB_OUTPUT"
          date_valid="$(awk -F= '$1 == "audit_date_valid" { print $2 }' <<< "$resolution")"
          if [[ "$date_valid" != true ]]; then
            echo 'The slot/date check failed; SSH and HTTPS inspection steps will be skipped.'
          fi

      - name: Validate redacted resource diagnostics
        shell: bash
        run: python3 -m unittest discover -s scripts/deployment -p 'test_audit_ovh_container_diagnostics.py'

      - name: Configure the pinned SSH connection
        if: steps.slot.outputs.audit_date_valid == 'true'
        shell: bash
        env:
          OVH_DEPLOY_SSH_KEY: ${{ secrets.OVH_DEPLOY_SSH_KEY }}
          AUDIT_UTC_DATE: ${{ steps.slot.outputs.audit_utc_date }}
        run: |
          set -Eeuo pipefail
          printf 'Audit UTC date: %s\n' "$AUDIT_UTC_DATE"
          : "${OVH_DEPLOY_HOST:?Configure the OVH host in ovh-preproduction}"
          : "${OVH_DEPLOY_USER:?Configure the OVH user in ovh-preproduction}"
          : "${OVH_DEPLOY_KNOWN_HOSTS:?Configure the verified OVH host key}"
          : "${OVH_DEPLOY_SSH_KEY:?Configure the OVH SSH key in ovh-preproduction}"
          [[ "$OVH_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$OVH_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$OVH_DEPLOY_SSH_KEY" > "$HOME/.ssh/ovh_deploy"
          printf '%s\n' "$OVH_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/ovh_deploy" "$HOME/.ssh/known_hosts"

      - name: Inspect host and container resources without changing services
        if: steps.slot.outputs.audit_date_valid == 'true'
        id: host
        shell: bash
        env:
          AUDIT_UTC_DATE: ${{ steps.slot.outputs.audit_utc_date }}
        run: |
          set -Eeuo pipefail
          printf 'Audit UTC date: %s\n' "$AUDIT_UTC_DATE"
          target="$OVH_DEPLOY_USER@$OVH_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          host_output="$(ssh "${ssh_args[@]}" "$target" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          printf '%s\n' '--- Host load and uptime ---'
          uptime
          printf '%s\n' '--- Host CPU capacity ---'
          nproc
          printf '%s\n' '--- Top host processes (PID, CPU %, RSS KiB, command name only) ---'
          ps -eo pid,pcpu,rss,comm --sort=-pcpu | head -n 8 || true
          printf '%s\n' '--- RAM ---'
          free -h
          printf '%s\n' '--- Swap ---'
          swapon --show || true
          printf '%s\n' '--- Containers (no environment values) ---'
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}'
          printf '%s\n' '--- Production container lifecycle (no environment values) ---'
          docker inspect --format 'status={{.State.Status}} restarts={{.RestartCount}} restart_policy={{.HostConfig.RestartPolicy.Name}} nano_cpus={{.HostConfig.NanoCpus}} cpu_period={{.HostConfig.CpuPeriod}} oom_killed={{.State.OOMKilled}} exit_code={{.State.ExitCode}} started_at={{.State.StartedAt}} finished_at={{.State.FinishedAt}} error={{.State.Error}}' lunidex-production-app
          printf 'audit_container_status=%s\n' "$(docker inspect --format '{{.State.Status}}' lunidex-production-app)"
          printf 'audit_container_health=%s\n' "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}unavailable{{end}}' lunidex-production-app)"
          printf 'audit_container_started_at=%s\n' "$(docker inspect --format '{{.State.StartedAt}}' lunidex-production-app)"
          printf 'audit_restart_count=%s\n' "$(docker inspect --format '{{.RestartCount}}' lunidex-production-app)"
          printf 'audit_container_oom_killed=%s\n' "$(docker inspect --format '{{.State.OOMKilled}}' lunidex-production-app)"
          printf 'audit_docker_cpu_pct=%s\n' "$(docker stats --no-stream --format '{{.CPUPerc}}' lunidex-production-app | tr -d '%')"
          host_ram_available_bytes="$(free -b | awk '$1 == "Mem:" { print $7 }')"
          printf 'audit_host_ram_available_bytes=%s\n' "$host_ram_available_bytes"
          root_fs_free_bytes="$(df -Pk / | awk 'NR == 2 { printf "%.0f", $4 * 1024 }')"
          printf 'audit_root_fs_free_bytes=%s\n' "$root_fs_free_bytes"
          printf '%s\n' '--- Recent production healthcheck results ---'
          docker inspect --format '{{range .State.Health.Log}}{{printf "%s exit=%d output=%q\n" .Start .ExitCode .Output}}{{end}}' lunidex-production-app 2>/dev/null | tail -n 10 || true
          printf '%s\n' '--- Production container events (last 6 hours) ---'
          docker events \
            --since 6h \
            --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --filter type=container \
            --filter container=lunidex-production-app \
            --format '{{.Time}} {{.Action}} name={{index .Actor.Attributes "name"}} exitCode={{index .Actor.Attributes "exitCode"}} signal={{index .Actor.Attributes "signal"}}' \
            | grep -E '(^| )(start|stop|die|oom|kill|restart|health_status:)' \
            | tail -n 40 || true
          printf '%s\n' '--- Production log signatures (raw log lines suppressed) ---'
          if production_logs="$(docker logs --since 6h --tail 2000 lunidex-production-app 2>&1)"; then
            printf '%s\n' 'log_capture_available=true'
            printf '%s\n' 'audit_log_capture_available=true'
          else
            printf '%s\n' 'log_capture_available=false'
            printf '%s\n' 'audit_log_capture_available=false'
          fi
          classify_log_signature() {
            local label="$1" pattern="$2" matched=false
            if grep -Eiq -- "$pattern" <<<"$production_logs"; then
              matched=true
            fi
            printf '%s=%s\n' "$label" "$matched"
          }
          classify_log_signature audit_v8_heap_oom 'JavaScript heap out of memory|Ineffective mark-compacts near heap limit|Reached heap limit|Allocation failed - JavaScript heap out of memory'
          classify_log_signature audit_node_fatal 'FATAL ERROR:|Fatal process out of memory|node::Abort\('
          classify_log_signature assertion_or_abort 'Assertion failed|AssertionError|SIGABRT|Aborted \(core dumped\)|abort\(\) called|Check failed:'
          classify_log_signature uncaught_or_unhandled 'uncaughtException|uncaught exception|unhandledRejection|unhandled promise rejection|UnhandledPromiseRejection|ERR_UNHANDLED_REJECTION'
          unset production_logs
          printf '%s\n' '--- Scheduled timers ---'
          systemctl list-timers --all --no-pager | grep -E 'lunidex|NEXT|LEFT' || true
          for timer in \
            lunidex-cron@metrics-retention.timer \
            lunidex-cron@tcg-sealed-sync.timer \
            lunidex-production-cron@metrics-retention.timer \
            lunidex-production-cron@tcg-sealed-sync.timer; do
            printf '%s: enabled=' "$timer"
            systemctl is-enabled "$timer" 2>/dev/null || true
            printf '%s: active=' "$timer"
            systemctl is-active "$timer" 2>/dev/null || true
          done
          REMOTE
          )"
          printf '%s\n' "$host_output"
          while IFS='=' read -r name value; do
            case "$name" in
              audit_container_status|audit_container_health|audit_container_started_at|audit_restart_count|audit_container_oom_killed|audit_log_capture_available|audit_v8_heap_oom|audit_node_fatal|audit_docker_cpu_pct|audit_host_ram_available_bytes|audit_root_fs_free_bytes)
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <<< "$host_output"

      - name: Inspect production memory, disk usage, and route-family logs by diagnostic run
        if: steps.slot.outputs.audit_date_valid == 'true'
        id: diagnostics
        shell: bash
        env:
          EXPECTED_HEAP_SAMPLE_RUN_ID: ${{ inputs.expected_heap_sample_run_id }}
          AUDIT_UTC_DATE: ${{ steps.slot.outputs.audit_utc_date }}
        run: |
          set -Eeuo pipefail
          printf 'Audit UTC date: %s\n' "$AUDIT_UTC_DATE"
          [[ -z "$EXPECTED_HEAP_SAMPLE_RUN_ID" || "$EXPECTED_HEAP_SAMPLE_RUN_ID" =~ ^[0-9]+-[0-9]+$ ]] || {
            echo 'The expected diagnostic run identifier must be empty or contain only digits and one hyphen.' >&2
            exit 78
          }
          audit_memory_captured_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          target="$OVH_DEPLOY_USER@$OVH_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote_command="EXPECTED_HEAP_SAMPLE_RUN_ID='$EXPECTED_HEAP_SAMPLE_RUN_ID' python3 -"
          diagnostics_output="$(ssh "${ssh_args[@]}" "$target" "$remote_command" < scripts/deployment/audit_ovh_container_diagnostics.py)"
          printf '%s\n' "$diagnostics_output"
          while IFS='=' read -r name value; do
            case "$name" in
              app_cgroup_memory_current_bytes|app_cgroup_memory_peak_bytes|app_cgroup_memory_stat_anon_bytes|app_cgroup_memory_stat_file_bytes|app_cgroup_memory_stat_inactive_file_bytes|app_cgroup_memory_stat_slab_bytes|app_cgroup_memory_stat_kernel_bytes|app_cgroup_memory_event_max|app_cgroup_memory_event_oom|app_cgroup_memory_event_oom_kill|app_cgroup_memory_event_oom_group_kill|app_host_runtime_1_vmrss_kib|app_host_runtime_1_cpu_pct|caddy_access_logs_available)
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <<< "$diagnostics_output"
          printf 'audit_memory_captured_at=%s\n' "$audit_memory_captured_at" >> "$GITHUB_OUTPUT"

      - name: Probe essential production HTTPS routes
        if: steps.slot.outputs.audit_date_valid == 'true'
        id: https
        shell: bash
        env:
          AUDIT_UTC_DATE: ${{ steps.slot.outputs.audit_utc_date }}
        run: bash scripts/deployment/probe_ovh_https.sh

      - name: Retrieve one matching sanitized heap sample
        if: inputs.expected_heap_sample_run_id != '' && steps.slot.outputs.audit_date_valid == 'true'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_HEAP_SAMPLE_RUN_ID: ${{ inputs.expected_heap_sample_run_id }}
          AUDIT_UTC_DATE: ${{ steps.slot.outputs.audit_utc_date }}
        run: |
          set -Eeuo pipefail
          printf 'Audit UTC date: %s\n' "$AUDIT_UTC_DATE"
          [[ "$EXPECTED_HEAP_SAMPLE_RUN_ID" =~ ^[0-9]+-[0-9]+$ ]] || {
            echo 'The expected heap sample run ID must contain only digits and one hyphen.' >&2
            exit 78
          }
          target="$OVH_DEPLOY_USER@$OVH_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          expected_prefix="LUNIDEX_HEAP_SAMPLE_SUMMARY_${EXPECTED_HEAP_SAMPLE_RUN_ID}="
          remote_command="EXPECTED_SUMMARY_PREFIX='$expected_prefix' bash -s"
          safe_summary="$(timeout 30s ssh "${ssh_args[@]}" "$target" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          [[ "${EXPECTED_SUMMARY_PREFIX:-}" =~ ^LUNIDEX_HEAP_SAMPLE_SUMMARY_[0-9]+-[0-9]+=$ ]]
          summary="$(docker logs --since 24h --tail 10000 lunidex-production-app 2>/dev/null \
            | awk -v prefix="$EXPECTED_SUMMARY_PREFIX" 'length($0) <= 16384 && index($0, prefix) == 1 { line = $0 } END { if (line != "") print line }' \
            || true)"
          [[ -n "$summary" ]] || {
            echo 'No bounded heap sample summary matched the requested run ID.' >&2
            exit 78
          }
          printf '%s\n' "$summary"
          REMOTE
          )"
          printf '%s\n' "$safe_summary" | node scripts/deployment/validate-heap-sample-summary.mjs "$EXPECTED_HEAP_SAMPLE_RUN_ID"

      - name: Retrieve restart-safe memory points for the exact diagnostic run
        if: inputs.expected_heap_sample_run_id != '' && steps.slot.outputs.audit_date_valid == 'true'
        shell: bash
        env:
          EXPECTED_HEAP_SAMPLE_RUN_ID: ${{ inputs.expected_heap_sample_run_id }}
          AUDIT_UTC_DATE: ${{ steps.slot.outputs.audit_utc_date }}
        run: |
          set -Eeuo pipefail
          printf 'Audit UTC date: %s\n' "$AUDIT_UTC_DATE"
          [[ "$EXPECTED_HEAP_SAMPLE_RUN_ID" =~ ^[0-9]+-[0-9]+$ ]] || {
            echo 'The expected heap sample run ID must contain only digits and one hyphen.' >&2
            exit 78
          }
          target="$OVH_DEPLOY_USER@$OVH_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          expected_prefix="LUNIDEX_HEAP_MEMORY_POINT_${EXPECTED_HEAP_SAMPLE_RUN_ID}="
          remote_command="EXPECTED_MEMORY_POINT_PREFIX='$expected_prefix' bash -s"
          safe_memory_points="$(timeout 30s ssh "${ssh_args[@]}" "$target" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          [[ "${EXPECTED_MEMORY_POINT_PREFIX:-}" =~ ^LUNIDEX_HEAP_MEMORY_POINT_[0-9]+-[0-9]+=$ ]]
          docker logs --since 24h --tail 50000 lunidex-production-app 2>/dev/null \
            | awk -v prefix="$EXPECTED_MEMORY_POINT_PREFIX" 'length($0) <= 512 && index($0, prefix) == 1 { print }' \
            || true
          REMOTE
          )"
          printf '%s\n' "$safe_memory_points" \
            | node scripts/deployment/validate-heap-sample-summary.mjs --memory-series "$EXPECTED_HEAP_SAMPLE_RUN_ID"

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/ovh_deploy"

  report:
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch'
    needs: [inspect]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Report audit status and T+1 comparison
        shell: bash
        env:
          AUDIT_RESULT: ${{ needs.inspect.result }}
          AUDIT_SLOT: ${{ needs.inspect.outputs.audit_slot }}
          INSPECT_AUDIT_UTC_DATE: ${{ needs.inspect.outputs.audit_utc_date }}
          AUDIT_DATE_VALID: ${{ needs.inspect.outputs.audit_date_valid }}
          AUDIT_DATE_ERROR: ${{ needs.inspect.outputs.audit_date_error }}
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM_READ_ONLY_INSPECTION: ${{ inputs.confirm_read_only_inspection }}
          MANUAL_AUDIT_SLOT: ${{ inputs.manual_audit_slot || 'adhoc' }}
          CONTAINER_STATUS: ${{ needs.inspect.outputs.container_status }}
          CONTAINER_HEALTH: ${{ needs.inspect.outputs.container_health }}
          CONTAINER_STARTED_AT: ${{ needs.inspect.outputs.container_started_at }}
          RESTART_COUNT: ${{ needs.inspect.outputs.restart_count }}
          CONTAINER_OOM_KILLED: ${{ needs.inspect.outputs.container_oom_killed }}
          LOG_CAPTURE_AVAILABLE: ${{ needs.inspect.outputs.log_capture_available }}
          V8_HEAP_OOM: ${{ needs.inspect.outputs.v8_heap_oom }}
          NODE_FATAL: ${{ needs.inspect.outputs.node_fatal }}
          DOCKER_CPU_PCT: ${{ needs.inspect.outputs.docker_cpu_pct }}
          HOST_RAM_AVAILABLE_BYTES: ${{ needs.inspect.outputs.host_ram_available_bytes }}
          ROOT_FS_FREE_BYTES: ${{ needs.inspect.outputs.root_fs_free_bytes }}
          CGROUP_CURRENT_BYTES: ${{ needs.inspect.outputs.cgroup_current_bytes }}
          CGROUP_PEAK_BYTES: ${{ needs.inspect.outputs.cgroup_peak_bytes }}
          CGROUP_ANON_BYTES: ${{ needs.inspect.outputs.cgroup_anon_bytes }}
          CGROUP_FILE_BYTES: ${{ needs.inspect.outputs.cgroup_file_bytes }}
          CGROUP_INACTIVE_FILE_BYTES: ${{ needs.inspect.outputs.cgroup_inactive_file_bytes }}
          CGROUP_SLAB_BYTES: ${{ needs.inspect.outputs.cgroup_slab_bytes }}
          CGROUP_KERNEL_BYTES: ${{ needs.inspect.outputs.cgroup_kernel_bytes }}
          CGROUP_EVENT_MAX: ${{ needs.inspect.outputs.cgroup_event_max }}
          CGROUP_OOM: ${{ needs.inspect.outputs.cgroup_oom }}
          CGROUP_OOM_KILL: ${{ needs.inspect.outputs.cgroup_oom_kill }}
          CGROUP_OOM_GROUP_KILL: ${{ needs.inspect.outputs.cgroup_oom_group_kill }}
          NODE_RSS_KIB: ${{ needs.inspect.outputs.node_rss_kib }}
          NODE_CPU_PCT: ${{ needs.inspect.outputs.node_cpu_pct }}
          CADDY_ACCESS_LOGS_AVAILABLE: ${{ needs.inspect.outputs.caddy_access_logs_available }}
          HEALTHZ_STATUS: ${{ needs.inspect.outputs.healthz_status }}
          HOME_STATUS: ${{ needs.inspect.outputs.home_status }}
          TCG_STATUS: ${{ needs.inspect.outputs.tcg_status }}
          MANIFEST_STATUS: ${{ needs.inspect.outputs.manifest_status }}
          SERVICE_WORKER_STATUS: ${{ needs.inspect.outputs.service_worker_status }}
          AUTH_SESSION_STATUS: ${{ needs.inspect.outputs.auth_session_status }}
          PROFILE_STATUS: ${{ needs.inspect.outputs.profile_status }}
          TLS_VERIFY_RESULT: ${{ needs.inspect.outputs.tls_verify_result }}
          AUDIT_CAPTURED_AT: ${{ needs.inspect.outputs.audit_memory_captured_at }}
        run: |
          set -Eeuo pipefail
          report_runner_utc_date="$(date -u +%F)"
          audit_utc_date="${INSPECT_AUDIT_UTC_DATE:-$report_runner_utc_date}"
          AUDIT_UTC_DATE="$audit_utc_date" \
            REPORT_RUNNER_UTC_DATE="$report_runner_utc_date" \
            python3 scripts/deployment/render_ovh_stability_report.py
