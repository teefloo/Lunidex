name: Isolated TCG RSC abort diagnostic

on:
  workflow_dispatch:
    inputs:
      image:
        description: Select the immutable production image or a local source build
        required: true
        default: production
        type: choice
        options:
          - production
          - source-candidate
      profile:
        description: Bounded isolated test profile
        required: true
        default: smoke-30s-c1
        type: choice
        options:
          - smoke-30s-c1
          - progressive-60s-c4
          - progressive-120s-c8
          - progressive-300s-c16
          - comparison-900s-c32
          - soak-full-3600s-c32
      target:
        description: Select a fixed local route for the isolated comparison
        required: true
        default: tcg-card
        type: choice
        options:
          - tcg-card
          - pokemon-detail
          - healthz
          - home
      confirm_isolated_rsc_test:
        description: >-
          Run only the selected isolated profile. App data and production services are not used; target-specific warm-up has fixed bounded upstream access, then all load phases have no egress. The 3600-second profile is full-response only and includes a 30-second idle recovery window. Standard runners for this public repository are free.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: isolated-tcg-rsc-diagnostic
  cancel-in-progress: false

jobs:
  compare:
    if: >-
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/fix-node-v8-oom-p0') &&
      inputs.confirm_isolated_rsc_test
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PRODUCTION_IMAGE: ghcr.io/teefloo/lunidex:ca08758609fb5cfefafff6d5c2aaee31ddc56f63
      CACHE_VOLUME: lunidex-isolated-rsc-cache
      INTERNAL_NETWORK: lunidex-isolated-rsc-internal
      WARM_CONTAINER: lunidex-isolated-rsc-warm
      ISOLATED_DIAGNOSTIC_IMAGE_MODE: ${{ inputs.image }}
      DIAGNOSTIC_PROFILE: ${{ inputs.profile }}
      DIAGNOSTIC_TARGET: ${{ inputs.target }}
    steps:
      - name: Check out the reviewed workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select allowlisted diagnostic image
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$ISOLATED_DIAGNOSTIC_IMAGE_MODE" in
            production)
              app_image="$PRODUCTION_IMAGE"
              ;;
            source-candidate)
              [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo 'candidate_image_tag_invalid=true' >&2
                exit 78
              }
              app_image="lunidex-oom-candidate:$GITHUB_SHA"
              ;;
            *)
              echo 'diagnostic_image_mode_invalid=true' >&2
              exit 78
              ;;
          esac
          printf 'APP_IMAGE=%s\n' "$app_image" >> "$GITHUB_ENV"

      - name: Build source candidate locally with public diagnostic values
        if: inputs.image == 'source-candidate'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$APP_IMAGE" == "lunidex-oom-candidate:$GITHUB_SHA" ]] || {
            echo 'candidate_image_tag_invalid=true' >&2
            exit 78
          }
          docker build --file Dockerfile --tag "$APP_IMAGE" \
            --build-arg NEXT_DEPLOYMENT_ID=isolated-diagnostic \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://lunidex-test.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_example \
            --build-arg 'NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=' \
            --build-arg 'NEXT_PUBLIC_POSTHOG_HOST=' \
            --build-arg NEXT_PUBLIC_POSTHOG_ENABLED=false \
            --build-arg NEXT_PUBLIC_POSTHOG_ENVIRONMENT=isolated-diagnostic \
            --build-arg NEXT_PUBLIC_APP_RELEASE=isolated-diagnostic \
            --build-arg NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE=0 \
            --build-arg 'NEXT_PUBLIC_SENTRY_DSN=' \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=isolated-diagnostic \
            --build-arg NEXT_PUBLIC_SENTRY_RELEASE=isolated-diagnostic \
            --build-arg 'NEXT_PUBLIC_GOOGLE_VERIFICATION=' \
            --build-arg 'NEXT_PUBLIC_VAPID_PUBLIC_KEY=' \
            .

      - name: Resolve bounded diagnostic profile
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$DIAGNOSTIC_PROFILE" in
            smoke-30s-c1)
              phase_seconds=30
              concurrency=1
              phases=full,abort
              ;;
            progressive-60s-c4)
              phase_seconds=60
              concurrency=4
              phases=full,abort
              ;;
            progressive-120s-c8)
              phase_seconds=120
              concurrency=8
              phases=full,abort
              ;;
            progressive-300s-c16)
              phase_seconds=300
              concurrency=16
              phases=full,abort
              ;;
            comparison-900s-c32)
              phase_seconds=900
              concurrency=32
              phases=full,abort
              ;;
            soak-full-3600s-c32)
              phase_seconds=3600
              concurrency=32
              phases=full
              ;;
            *)
              echo 'diagnostic_profile_invalid=true' >&2
              exit 78
              ;;
          esac
          case "$DIAGNOSTIC_TARGET" in
            tcg-card)
              egress_policy=tcg
              ;;
            pokemon-detail)
              egress_policy=pokemon
              ;;
            healthz|home)
              egress_policy=none
              ;;
            *)
              echo 'diagnostic_target_invalid=true' >&2
              exit 78
              ;;
          esac
          {
            printf 'PHASE_SECONDS=%s\n' "$phase_seconds"
            printf 'ISOLATED_TCG_CONCURRENCY=%s\n' "$concurrency"
            printf 'ISOLATED_TCG_PHASES=%s\n' "$phases"
            printf 'ISOLATED_TCG_TARGET=%s\n' "$DIAGNOSTIC_TARGET"
            printf 'ISOLATED_EGRESS_POLICY=%s\n' "$egress_policy"
          } >> "$GITHUB_ENV"
          echo "diagnostic_profile=$DIAGNOSTIC_PROFILE"
          echo "diagnostic_target=$DIAGNOSTIC_TARGET"

      - name: Validate bounded diagnostic harness
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check scripts/deployment/isolated-tcg-rsc-load.mjs
          node --check scripts/deployment/warm-isolated-diagnostic-route.mjs
          node --check scripts/deployment/validate-isolated-diagnostic-warmup.mjs
          node --check scripts/deployment/classify-isolated-node-logs.mjs
          node --check scripts/deployment/classify-isolated-node-logs.test.mjs
          node --check scripts/deployment/normalize-isolated-container-state.mjs
          node --check scripts/deployment/normalize-isolated-container-state.test.mjs
          node --check scripts/deployment/normalize-isolated-container-stats.mjs
          node --check scripts/deployment/normalize-isolated-container-stats.test.mjs
          node --check scripts/deployment/classify-isolated-docker-launch-error.mjs
          node --check scripts/deployment/classify-isolated-docker-launch-error.test.mjs
          node --check scripts/deployment/sample-isolated-container-resources.mjs
          node --check scripts/deployment/validate-isolated-container-resource-series.mjs
          node --check scripts/deployment/isolated-tcg-egress-proxy.mjs
          node --check scripts/deployment/validate-isolated-tcg-rsc-summary.mjs
          node --check scripts/deployment/validate-isolated-tcg-egress-summary.mjs
          bash -n scripts/deployment/run-isolated-tcg-rsc-phases.sh

      - name: Authenticate to GHCR and pull the immutable production image
        if: inputs.image == 'production'
        shell: bash
        env:
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull "$PRODUCTION_IMAGE" >/dev/null
          docker logout ghcr.io >/dev/null
          unset GHCR_READ_TOKEN

      - name: Test the diagnostic harness with the pinned Node 22 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --network none \
            --cpus 0.5 \
            --memory 256m \
            --memory-swap 256m \
            --pids-limit 64 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --workdir /workspace \
            --env NODE_OPTIONS= \
            --env ISOLATED_DIAGNOSTIC_SKIP_SAMPLER_PROCESS_TEST=1 \
            --env ISOLATED_DIAGNOSTIC_SKIP_DOCKER_LAUNCH_MOCK_TEST=1 \
            --entrypoint node \
            "$APP_IMAGE" --test \
              scripts/deployment/isolated-tcg-rsc-load.test.mjs \
              scripts/deployment/warm-isolated-diagnostic-route.test.mjs \
              scripts/deployment/classify-isolated-node-logs.test.mjs \
              scripts/deployment/classify-isolated-docker-launch-error.test.mjs \
              scripts/deployment/normalize-isolated-container-stats.test.mjs \
              scripts/deployment/isolated-tcg-egress-proxy.test.mjs

      - name: Create ephemeral cache and internal-only test network
        shell: bash
        run: |
          set -Eeuo pipefail
          docker network create --internal "$INTERNAL_NETWORK" >/dev/null
          docker volume create "$CACHE_VOLUME" >/dev/null

      - name: Warm the selected fixed route, then remove all egress
        shell: bash
        run: |
          set -Eeuo pipefail
          proxy_name=lunidex-isolated-rsc-egress-proxy
          proxy_env_args=()
          proxy_started=false
          if [[ "$ISOLATED_EGRESS_POLICY" != none ]]; then
            docker run --detach \
              --name "$proxy_name" \
              --network bridge \
              --cpus 0.05 \
              --memory 32m \
              --memory-swap 32m \
              --pids-limit 32 \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=8m \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/deployment/isolated-tcg-egress-proxy.mjs,dst=/tmp/egress-proxy.mjs,readonly" \
              --env NODE_OPTIONS= \
              --env "ISOLATED_EGRESS_POLICY=$ISOLATED_EGRESS_POLICY" \
              --entrypoint node \
              "$APP_IMAGE" /tmp/egress-proxy.mjs >/dev/null
            docker network connect --alias tcg-egress-proxy "$INTERNAL_NETWORK" "$proxy_name"
            proxy_env_args+=(
              --env HTTPS_PROXY=http://tcg-egress-proxy:3128
              --env HTTP_PROXY=http://tcg-egress-proxy:3128
              --env https_proxy=http://tcg-egress-proxy:3128
              --env http_proxy=http://tcg-egress-proxy:3128
              --env NO_PROXY=127.0.0.1,localhost
              --env no_proxy=127.0.0.1,localhost
            )
            proxy_started=true
          fi

          docker run --detach \
            --init \
            --name "$WARM_CONTAINER" \
            --network "$INTERNAL_NETWORK" \
            --cpus 1 \
            --memory 2176m \
            --memory-swap 2176m \
            --pids-limit 256 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "type=volume,source=$CACHE_VOLUME,target=/app/.next/cache" \
            --env NODE_ENV=production \
            --env NEXT_TELEMETRY_DISABLED=1 \
            --env HOSTNAME=0.0.0.0 \
            --env PORT=3000 \
            --env NODE_OPTIONS='--max-old-space-size=1408 --use-env-proxy --inspect=127.0.0.1:9229 --expose-gc' \
            "${proxy_env_args[@]}" \
            --env SENTRY_DSN= \
            --env NEXT_PUBLIC_SENTRY_DSN= \
            --env NEXT_PUBLIC_POSTHOG_ENABLED=false \
            "$APP_IMAGE" >/dev/null

          ready=false
          for attempt in $(seq 1 90); do
            if docker exec --env NODE_OPTIONS= "$WARM_CONTAINER" node -e \
              'fetch("http://127.0.0.1:3000/api/healthz", { signal: AbortSignal.timeout(2000) }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))' \
              >/dev/null 2>&1; then
              ready=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$WARM_CONTAINER" 2>/dev/null || true)" != true ]]; then
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]] || {
            echo 'warmup_app_not_ready=true'
            exit 1
          }

          warmup_result="$(timeout 130s docker exec --interactive \
            --env NODE_OPTIONS= \
            --env "ISOLATED_TCG_TARGET=$ISOLATED_TCG_TARGET" \
            --env "ISOLATED_EGRESS_POLICY=$ISOLATED_EGRESS_POLICY" \
            "$WARM_CONTAINER" node --input-type=module - \
            < "$GITHUB_WORKSPACE/scripts/deployment/warm-isolated-diagnostic-route.mjs" 2>/dev/null)" || {
            echo 'warmup_route_request_failed=true'
            exit 1
          }
          printf '%s\n' "$warmup_result" | node scripts/deployment/validate-isolated-diagnostic-warmup.mjs "$ISOLATED_TCG_TARGET"

          docker stop --time 2 "$WARM_CONTAINER" >/dev/null
          docker rm --force "$WARM_CONTAINER" >/dev/null
          if [[ "$proxy_started" == true ]]; then
            docker stop --time 2 "$proxy_name" >/dev/null
            proxy_summary="$(docker logs "$proxy_name" 2>/dev/null | tail -n 1)"
            [[ -n "$proxy_summary" ]] || {
              echo 'warmup_egress_summary_missing=true'
              exit 1
            }
            printf '%s\n' "$proxy_summary" | node scripts/deployment/validate-isolated-tcg-egress-summary.mjs "$ISOLATED_EGRESS_POLICY"
            docker rm --force "$proxy_name" >/dev/null
          else
            echo 'warmup_egress_policy=none'
          fi
          echo 'warmup_complete=true'
          echo 'test_network_egress=disabled'

      - name: Run full-response and client-abort phases with egress disabled
        shell: bash
        run: |
          set -Eeuo pipefail
          APP_IMAGE="$APP_IMAGE" PHASE_SECONDS="$PHASE_SECONDS" \
            ISOLATED_DIAGNOSTIC_IMAGE_MODE="$ISOLATED_DIAGNOSTIC_IMAGE_MODE" \
            ISOLATED_TCG_CONCURRENCY="$ISOLATED_TCG_CONCURRENCY" \
            ISOLATED_TCG_PHASES="$ISOLATED_TCG_PHASES" \
            ISOLATED_TCG_TARGET="$ISOLATED_TCG_TARGET" \
            bash scripts/deployment/run-isolated-tcg-rsc-phases.sh

      - name: Remove diagnostic containers, network, and volume
        if: always()
        shell: bash
        run: |
          set +e
          docker rm --force \
            "$WARM_CONTAINER" \
            lunidex-isolated-rsc-egress-proxy \
            lunidex-isolated-rsc-full-app lunidex-isolated-rsc-full-anchor \
            lunidex-isolated-rsc-abort-app lunidex-isolated-rsc-abort-anchor >/dev/null 2>&1
          docker network rm "$INTERNAL_NETWORK" >/dev/null 2>&1
          docker volume rm "$CACHE_VOLUME" >/dev/null 2>&1
          docker logout ghcr.io >/dev/null 2>&1
          echo 'diagnostic_resources_removed=true'
