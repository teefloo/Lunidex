name: Deploy OVH preproduction

on:
  push:
    branches:
      - codex/ovh-vps-migration
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Deploy the selected commit to the OVH preproduction server
        required: true
        default: false
        type: boolean
      bootstrap_production_ssh_key:
        description: Append the separate production deploy public key to the OVH SSH user's authorized_keys
        required: true
        default: false
        type: boolean
      inspect_read_only_resources:
        description: Read RAM, CPU, disk, containers, and timer states without changing services
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  inspect_read_only_resources:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/ovh-vps-migration' &&
      inputs.inspect_read_only_resources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ovh-preproduction
    permissions:
      contents: read
    concurrency:
      group: ovh-vps-read-only-resource-audit
      cancel-in-progress: false
    env:
      OVH_DEPLOY_HOST: ${{ vars.OVH_DEPLOY_HOST }}
      OVH_DEPLOY_USER: ${{ vars.OVH_DEPLOY_USER }}
      OVH_DEPLOY_KNOWN_HOSTS: ${{ vars.OVH_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Configure the pinned SSH connection
        shell: bash
        env:
          OVH_DEPLOY_SSH_KEY: ${{ secrets.OVH_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          : "$OVH_DEPLOY_HOST"
          : "$OVH_DEPLOY_USER"
          : "$OVH_DEPLOY_KNOWN_HOSTS"
          : "$OVH_DEPLOY_SSH_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$OVH_DEPLOY_SSH_KEY" > "$HOME/.ssh/ovh_deploy"
          printf '%s\n' "$OVH_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/ovh_deploy" "$HOME/.ssh/known_hosts"

      - name: Inspect VPS resources and timer states without changing services
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$OVH_DEPLOY_USER@$OVH_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" "$target" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          printf '%s\n' '--- Host load and uptime ---'
          uptime
          printf '%s\n' '--- RAM ---'
          free -h
          printf '%s\n' '--- Disk ---'
          df -h / /opt
          printf '%s\n' '--- Swap ---'
          swapon --show || true
          printf '%s\n' '--- Containers (no environment values) ---'
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}'
          printf '%s\n' '--- Scheduled timers ---'
          systemctl list-timers --all --no-pager | grep -E 'lunidex|NEXT|LEFT' || true
          for timer in \
            lunidex-cron@metrics-retention.timer \
            lunidex-cron@tcg-sealed-sync.timer \
            lunidex-production-cron@metrics-retention.timer \
            lunidex-production-cron@tcg-sealed-sync.timer; do
            printf '%s: enabled=' "$timer"
            systemctl is-enabled "$timer" 2>/dev/null || true
            printf '%s: active=' "$timer"
            systemctl is-active "$timer" 2>/dev/null || true
          done
          REMOTE

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/ovh_deploy"

  bootstrap_production_key:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/ovh-vps-migration' &&
      inputs.bootstrap_production_ssh_key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ovh-preproduction
    concurrency:
      group: lunidex-ovh-production-key-bootstrap
      cancel-in-progress: false
    env:
      OVH_DEPLOY_HOST: ${{ vars.OVH_DEPLOY_HOST }}
      OVH_DEPLOY_USER: ${{ vars.OVH_DEPLOY_USER }}
      OVH_DEPLOY_KNOWN_HOSTS: ${{ vars.OVH_DEPLOY_KNOWN_HOSTS }}
      OVH_PRODUCTION_DEPLOY_PUBLIC_KEY: ${{ vars.OVH_PRODUCTION_DEPLOY_PUBLIC_KEY }}
    steps:
      - name: Validate the exact VPS, account, and Ed25519 public key
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$OVH_DEPLOY_HOST" == '51.255.40.19' || "$OVH_DEPLOY_HOST" == 'vps-5aa00f9a.vps.ovh.net' ]] || {
            echo 'Refusing to install a key on an unexpected VPS host.' >&2
            exit 78
          }
          [[ "$OVH_DEPLOY_USER" == 'lunidex-deploy' ]] || {
            echo 'Refusing to install a key for an unexpected SSH account.' >&2
            exit 78
          }
          [[ "$OVH_PRODUCTION_DEPLOY_PUBLIC_KEY" =~ ^ssh-ed25519[[:space:]]+[A-Za-z0-9+/=]+([[:space:]][A-Za-z0-9._@+-]+)?$ ]] || {
            echo 'Set OVH_PRODUCTION_DEPLOY_PUBLIC_KEY to the generated single-line Ed25519 public key.' >&2
            exit 78
          }
          : "$OVH_DEPLOY_KNOWN_HOSTS"

      - name: Configure the existing pinned preproduction SSH connection
        shell: bash
        env:
          OVH_DEPLOY_SSH_KEY: ${{ secrets.OVH_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          : "$OVH_DEPLOY_SSH_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$OVH_DEPLOY_SSH_KEY" > "$HOME/.ssh/ovh_deploy"
          printf '%s\n' "$OVH_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/ovh_deploy" "$HOME/.ssh/known_hosts"

      - name: Append only the production public key, idempotently
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$OVH_DEPLOY_USER@$OVH_DEPLOY_HOST"
          runner_key="$RUNNER_TEMP/lunidex-production-key-$GITHUB_RUN_ID.pub"
          remote_key="/tmp/lunidex-production-key-$GITHUB_RUN_ID.pub"
          umask 077
          printf '%s\n' "$OVH_PRODUCTION_DEPLOY_PUBLIC_KEY" > "$runner_key"
          ssh-keygen -l -f "$runner_key" >/dev/null
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_args[@]}" "$runner_key" "$target:$remote_key"
          remote_command="set -Eeuo pipefail; keyfile='$remote_key'; trap 'rm -f \"\$keyfile\"' EXIT; [[ \"\$(id -un)\" == lunidex-deploy ]]; home=\$(getent passwd lunidex-deploy | cut -d: -f6); [[ \"\$home\" == /home/lunidex-deploy ]]; [[ ! -L \"\$home/.ssh\" ]]; install -d -m 0700 \"\$home/.ssh\"; auth=\"\$home/.ssh/authorized_keys\"; [[ ! -L \"\$auth\" ]]; touch \"\$auth\"; chmod 0600 \"\$auth\"; if ! grep -Fqx -f \"\$keyfile\" \"\$auth\"; then cat \"\$keyfile\" >> \"\$auth\"; fi; chmod 0600 \"\$auth\"; echo 'Production deploy public key is installed idempotently.'"
          ssh "${ssh_args[@]}" "$target" "$remote_command"

      - name: Remove temporary public key copy and SSH key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lunidex-production-key-$GITHUB_RUN_ID.pub" "$HOME/.ssh/ovh_deploy"

  deploy:
    if: >-
      github.ref == 'refs/heads/codex/ovh-vps-migration' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_deployment))
    runs-on: ubuntu-latest
    environment: ovh-preproduction
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_NEON_AUTH_URL: ${{ vars.NEXT_PUBLIC_NEON_AUTH_URL }}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_ENABLED: ${{ vars.NEXT_PUBLIC_POSTHOG_ENABLED }}
      NEXT_PUBLIC_POSTHOG_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_POSTHOG_ENVIRONMENT }}
      NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ vars.NEXT_PUBLIC_SENTRY_RELEASE }}
      NEXT_PUBLIC_GOOGLE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_VERIFICATION }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      OVH_DEPLOY_HOST: ${{ vars.OVH_DEPLOY_HOST }}
      OVH_DEPLOY_USER: ${{ vars.OVH_DEPLOY_USER }}
      OVH_DEPLOY_KNOWN_HOSTS: ${{ vars.OVH_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Guard the preproduction branch
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/codex/ovh-vps-migration' ]] || {
            echo 'This workflow only deploys codex/ovh-vps-migration.' >&2
            exit 1
          }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Require a test Neon environment
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${NEXT_PUBLIC_NEON_AUTH_URL:?Set this public URL to the isolated preproduction Neon Auth branch}"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run seo:check

      - run: npm run build

      - run: npx tsc --project packages/core/tsconfig.json --noEmit

      - name: Build and publish the immutable SHA image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -Eeuo pipefail
          image=ghcr.io/teefloo/lunidex
          docker buildx version
          docker buildx create --name lunidex-builder --driver docker-container --use
          docker buildx inspect --bootstrap
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          build_args=(
            --build-arg "NEXT_DEPLOYMENT_ID=${GITHUB_SHA}"
            --build-arg "NEXT_PUBLIC_NEON_AUTH_URL=${NEXT_PUBLIC_NEON_AUTH_URL:-}"
            --build-arg "NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}"
            --build-arg "NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-}"
            --build-arg "NEXT_PUBLIC_POSTHOG_ENABLED=${NEXT_PUBLIC_POSTHOG_ENABLED:-false}"
            --build-arg "NEXT_PUBLIC_POSTHOG_ENVIRONMENT=${NEXT_PUBLIC_POSTHOG_ENVIRONMENT:-}"
            --build-arg "NEXT_PUBLIC_APP_RELEASE=${GITHUB_SHA}"
            --build-arg "NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE=${NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE:-}"
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}"
            --build-arg "NEXT_PUBLIC_SENTRY_ENVIRONMENT=${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-}"
            --build-arg "NEXT_PUBLIC_SENTRY_RELEASE=${NEXT_PUBLIC_SENTRY_RELEASE:-${GITHUB_SHA}}"
            --build-arg "NEXT_PUBLIC_GOOGLE_VERIFICATION=${NEXT_PUBLIC_GOOGLE_VERIFICATION:-}"
            --build-arg "NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}"
          )
          secret_args=()
          if [[ -n "${SENTRY_AUTH_TOKEN:-}" ]]; then
            secret_args+=(--secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN)
          fi

          docker buildx build \
            --platform linux/amd64 \
            --tag "$image:$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "${build_args[@]}" \
            "${secret_args[@]}" \
            --push .
          docker logout ghcr.io >/dev/null

      - name: Configure the pinned SSH connection
        shell: bash
        env:
          OVH_DEPLOY_SSH_KEY: ${{ secrets.OVH_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          : "${OVH_DEPLOY_HOST:?Configure OVH_DEPLOY_HOST in the ovh-preproduction environment}"
          : "${OVH_DEPLOY_USER:?Configure OVH_DEPLOY_USER in the ovh-preproduction environment}"
          : "${OVH_DEPLOY_KNOWN_HOSTS:?Configure OVH_DEPLOY_KNOWN_HOSTS after verifying the OVH host key}"
          : "${OVH_DEPLOY_SSH_KEY:?Configure OVH_DEPLOY_SSH_KEY in the ovh-preproduction environment}"
          [[ "$OVH_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$OVH_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$OVH_DEPLOY_SSH_KEY" > "$HOME/.ssh/ovh_deploy"
          printf '%s\n' "$OVH_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/ovh_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy and verify the preproduction image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required for GHCR access}"
          target="$OVH_DEPLOY_USER@$OVH_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" "$target" 'install -d -m 0755 /opt/lunidex/scripts/deployment /opt/lunidex/deploy/systemd'
          scp "${ssh_args[@]}" compose.yaml Caddyfile "$target:/opt/lunidex/"
          scp "${ssh_args[@]}" scripts/deployment/*.sh "$target:/opt/lunidex/scripts/deployment/"
          scp "${ssh_args[@]}" deploy/systemd/* "$target:/opt/lunidex/deploy/systemd/"
          ssh "${ssh_args[@]}" "$target" 'bash /opt/lunidex/scripts/deployment/update-cloudflare-ranges.sh /opt/lunidex/cloudflare-ips.env'
          remote_command="set -euo pipefail; export DOCKER_CONFIG=\$(mktemp -d /tmp/lunidex-docker.XXXXXX); trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT; if ! docker login ghcr.io --username teefloo --password-stdin; then echo 'GHCR login failed.' >&2; exit 1; fi; bash /opt/lunidex/scripts/deployment/deploy-ovh.sh $GITHUB_SHA; if ! bash /opt/lunidex/scripts/deployment/healthcheck.sh; then echo 'Healthcheck failed; attempting rollback.' >&2; bash /opt/lunidex/scripts/deployment/rollback-ovh.sh || true; exit 1; fi"
          printf '%s' "$GITHUB_TOKEN" | ssh "${ssh_args[@]}" "$target" "$remote_command"

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/ovh_deploy"
