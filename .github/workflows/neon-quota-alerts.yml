name: Neon quota monitor

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    name: Read Neon Free usage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: neon-quota-monitor
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: withered-block-08834461
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read project usage and report quota thresholds
        run: python3 scripts/deployment/neon_quota_usage.py
