name: Deploy OVH production

on:
  workflow_dispatch:
    inputs:
      production_commit:
        description: Exact 40-character master commit SHA to build and deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_OVH_PRODUCTION to authorize this production workflow
        required: true
        type: string
      deployment_mode:
        description: Preflight tests the image without keeping it running; deploy starts the app behind Caddy
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy
      heap_sampling_diagnostic:
        description: Collect a sanitized Node heap summary and bounded memory time series during a short production deploy window
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lunidex-ovh-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      inputs.confirmation == 'DEPLOY_OVH_PRODUCTION' &&
      inputs.production_commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ovh-production
    permissions:
      contents: read
      packages: write
    env:
      PRODUCTION_COMMIT: ${{ inputs.production_commit }}
      PRODUCTION_CONFIRMATION: ${{ inputs.confirmation }}
      DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
      HEAP_SAMPLING_DIAGNOSTIC: ${{ inputs.heap_sampling_diagnostic }}
      HEAP_SAMPLING_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_PUBLIC_NEON_AUTH_URL: ${{ vars.NEXT_PUBLIC_NEON_AUTH_URL }}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_ENABLED: ${{ vars.NEXT_PUBLIC_POSTHOG_ENABLED || 'false' }}
      NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_GOOGLE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_VERIFICATION }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      OVH_PRODUCTION_DEPLOY_HOST: ${{ vars.OVH_PRODUCTION_DEPLOY_HOST }}
      OVH_PRODUCTION_DEPLOY_USER: ${{ vars.OVH_PRODUCTION_DEPLOY_USER }}
      OVH_PRODUCTION_DEPLOY_KNOWN_HOSTS: ${{ vars.OVH_PRODUCTION_DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Guard the production branch and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/master' ]] || {
            echo 'Production deployment is permitted only from master.' >&2
            exit 1
          }
          [[ "$PRODUCTION_CONFIRMATION" == 'DEPLOY_OVH_PRODUCTION' ]] || {
            echo 'The exact production confirmation phrase is required.' >&2
            exit 1
          }
          [[ "$PRODUCTION_COMMIT" == "$GITHUB_SHA" && "$PRODUCTION_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'The requested full SHA must equal the selected master commit.' >&2
            exit 1
          }
          [[ "$DEPLOYMENT_MODE" == 'preflight' || "$DEPLOYMENT_MODE" == 'deploy' ]] || {
            echo 'Unknown production deployment mode.' >&2
            exit 1
          }
          if [[ "$HEAP_SAMPLING_DIAGNOSTIC" == 'true' && "$DEPLOYMENT_MODE" != 'deploy' ]]; then
            echo 'Heap sampling can only be enabled for the confirmed production deploy mode.' >&2
            exit 78
          fi
          [[ "$HEAP_SAMPLING_RUN_ID" =~ ^[0-9]+-[0-9]+$ ]] || {
            echo 'The production diagnostic run identifier is invalid.' >&2
            exit 78
          }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.production_commit }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Require the production Neon Auth public URL
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$NEXT_PUBLIC_NEON_AUTH_URL" ]] || {
            echo 'Set NEXT_PUBLIC_NEON_AUTH_URL in the ovh-production environment.' >&2
            exit 78
          }

      - name: Require production contact delivery configuration
        if: inputs.deployment_mode == 'deploy'
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ vars.CONTACT_TO_EMAIL }}
          CONTACT_FROM_EMAIL: ${{ vars.CONTACT_FROM_EMAIL }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "${RESEND_API_KEY//[[:space:]]/}" ]] || missing+=(RESEND_API_KEY)
          [[ -n "${CONTACT_TO_EMAIL//[[:space:]]/}" ]] || missing+=(CONTACT_TO_EMAIL)
          [[ -n "${CONTACT_FROM_EMAIL//[[:space:]]/}" ]] || missing+=(CONTACT_FROM_EMAIL)
          if ((${#missing[@]})); then
            printf 'Missing required production contact setting names:' >&2
            printf ' %s' "${missing[@]}" >&2
            printf '\n' >&2
            exit 78
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run seo:check
      - run: npm run build
      - run: npx tsc --project packages/core/tsconfig.json --noEmit

      - name: Verify the pinned d0f5 rollback image in isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/deployment/validate-image-isolated.sh \
            'ghcr.io/teefloo/lunidex@sha256:9ca8f66d0b5f79a984358d12fe1c382319df7364388ec2d5df78fe3c5afc318a' \
            'd0f5e1af2cf95dd43eb046069c0d37f0a2add93e'

      - name: Build and publish the candidate image
        id: candidate_image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -Eeuo pipefail
          image=ghcr.io/teefloo/lunidex
          metadata_file="$RUNNER_TEMP/lunidex-image-metadata.json"
          candidate_tag="$image:$PRODUCTION_COMMIT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx version
          docker buildx create --name lunidex-production-builder --driver docker-container --use
          docker buildx inspect --bootstrap
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          build_args=(
            --build-arg "NEXT_DEPLOYMENT_ID=$PRODUCTION_COMMIT"
            --build-arg "NEXT_PUBLIC_NEON_AUTH_URL=$NEXT_PUBLIC_NEON_AUTH_URL"
            --build-arg "NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=$NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN"
            --build-arg "NEXT_PUBLIC_POSTHOG_HOST=$NEXT_PUBLIC_POSTHOG_HOST"
            --build-arg "NEXT_PUBLIC_POSTHOG_ENABLED=$NEXT_PUBLIC_POSTHOG_ENABLED"
            --build-arg "NEXT_PUBLIC_POSTHOG_ENVIRONMENT=production"
            --build-arg "NEXT_PUBLIC_APP_RELEASE=$PRODUCTION_COMMIT"
            --build-arg "NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE=$NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE"
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN"
            --build-arg "NEXT_PUBLIC_SENTRY_ENVIRONMENT=production"
            --build-arg "NEXT_PUBLIC_SENTRY_RELEASE=$PRODUCTION_COMMIT"
            --build-arg "NEXT_PUBLIC_GOOGLE_VERIFICATION=$NEXT_PUBLIC_GOOGLE_VERIFICATION"
            --build-arg "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$NEXT_PUBLIC_VAPID_PUBLIC_KEY"
          )
          secret_args=()
          if [[ -n "$SENTRY_AUTH_TOKEN" ]]; then
            secret_args+=(--secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN)
          fi

          docker buildx build \
            --platform linux/amd64 \
            --tag "$candidate_tag" \
            --label "org.opencontainers.image.revision=$PRODUCTION_COMMIT" \
            --metadata-file "$metadata_file" \
            "${build_args[@]}" \
            "${secret_args[@]}" \
            --push .
          digest="$(jq -r '."containerimage.digest" // empty' "$metadata_file")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Buildx did not return an immutable image digest.' >&2
            exit 78
          }
          image_ref="$image@$digest"
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          printf 'image_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          {
            echo '## Immutable OVH candidate image'
            echo
            echo "- Source commit: \`$PRODUCTION_COMMIT\`"
            echo "- Candidate: \`$image_ref\`"
            echo '- Platform: \`linux/amd64\`'
            echo
            echo 'Rollback: \`ghcr.io/teefloo/lunidex@sha256:9ca8f66d0b5f79a984358d12fe1c382319df7364388ec2d5df78fe3c5afc318a\` (d0f5).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the candidate Compose contract and app health in isolation
        shell: bash
        env:
          IMAGE_REF: ${{ steps.candidate_image.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          bash scripts/deployment/validate-image-isolated.sh "$IMAGE_REF" "$PRODUCTION_COMMIT"

      - name: Log out of GHCR on the GitHub runner
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Require Neon Auth functionality before replacing production
        if: inputs.deployment_mode == 'deploy'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/deployment/check-neon-production.sh https://lunidex.app/api/auth/get-session

      - name: Prepare the server-only production environment
        if: inputs.deployment_mode == 'deploy'
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          LUNIDEX_CRON_SECRET: ${{ secrets.LUNIDEX_CRON_SECRET }}
          LUNIDEX_VAPID_PRIVATE_KEY: ${{ secrets.LUNIDEX_VAPID_PRIVATE_KEY }}
          LUNIDEX_VAPID_SUBJECT: ${{ vars.LUNIDEX_VAPID_SUBJECT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ vars.CONTACT_TO_EMAIL }}
          CONTACT_FROM_EMAIL: ${{ vars.CONTACT_FROM_EMAIL }}
        run: |
          set -Eeuo pipefail
          app_env="$RUNNER_TEMP/lunidex-production-app.env"
          umask 077
          : > "$app_env"

          append_env() {
            local name="$1" value="$2" required="$3"
            if [[ "$required" == 'yes' && -z "$value" ]]; then
              echo "Missing required production setting: $name" >&2
              exit 78
            fi
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
              echo "Production setting $name must be a single line." >&2
              exit 78
            }
            if [[ -n "$value" ]]; then
              printf '%s=%s\n' "$name" "$value" >> "$app_env"
            fi
          }

          append_env NEON_DATABASE_URL "$NEON_DATABASE_URL" yes
          append_env NEON_AUTH_BASE_URL "$NEON_AUTH_BASE_URL" yes
          append_env NEON_AUTH_JWKS_URL "$NEON_AUTH_JWKS_URL" yes
          append_env NEON_AUTH_COOKIE_SECRET "$NEON_AUTH_COOKIE_SECRET" yes
          append_env LUNIDEX_CRON_SECRET "$LUNIDEX_CRON_SECRET" yes
          append_env LUNIDEX_VAPID_PRIVATE_KEY "$LUNIDEX_VAPID_PRIVATE_KEY" no
          append_env LUNIDEX_VAPID_SUBJECT "$LUNIDEX_VAPID_SUBJECT" no
          append_env RESEND_API_KEY "$RESEND_API_KEY" no
          append_env CONTACT_TO_EMAIL "$CONTACT_TO_EMAIL" no
          append_env CONTACT_FROM_EMAIL "$CONTACT_FROM_EMAIL" no
          if [[ "$HEAP_SAMPLING_DIAGNOSTIC" == 'true' ]]; then
            diagnostic_expires_at=$(( $(date -u +%s) + 15 * 60 ))
            append_env LUNIDEX_HEAP_SAMPLER_DIAGNOSTIC enabled yes
            append_env LUNIDEX_HEAP_SAMPLER_EXPIRES_AT "$diagnostic_expires_at" yes
            append_env LUNIDEX_HEAP_SAMPLER_RUN_ID "$HEAP_SAMPLING_RUN_ID" yes
          fi
          chmod 0600 "$app_env"

      - name: Configure the separate production SSH connection
        if: inputs.deployment_mode == 'deploy'
        shell: bash
        env:
          OVH_PRODUCTION_DEPLOY_SSH_KEY: ${{ secrets.OVH_PRODUCTION_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          : "$OVH_PRODUCTION_DEPLOY_HOST"
          : "$OVH_PRODUCTION_DEPLOY_USER"
          : "$OVH_PRODUCTION_DEPLOY_KNOWN_HOSTS"
          : "$OVH_PRODUCTION_DEPLOY_SSH_KEY"
          [[ "$OVH_PRODUCTION_DEPLOY_HOST" == '51.255.40.19' || "$OVH_PRODUCTION_DEPLOY_HOST" == 'vps-5aa00f9a.vps.ovh.net' ]]
          [[ "$OVH_PRODUCTION_DEPLOY_USER" == 'lunidex-deploy' ]]
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$OVH_PRODUCTION_DEPLOY_SSH_KEY" > "$HOME/.ssh/ovh_deploy"
          printf '%s\n' "$OVH_PRODUCTION_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/ovh_deploy" "$HOME/.ssh/known_hosts"

      - name: Bootstrap the isolated production root through Docker
        if: inputs.deployment_mode == 'deploy'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ steps.candidate_image.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          target="$OVH_PRODUCTION_DEPLOY_USER@$OVH_PRODUCTION_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          bootstrap_script="$(ssh "${ssh_args[@]}" "$target" 'umask 077; mktemp /tmp/lunidex-production-bootstrap.XXXXXX')"
          [[ "$bootstrap_script" =~ ^/tmp/lunidex-production-bootstrap\.[A-Za-z0-9]{6}$ ]] || {
            echo 'The VPS did not provide a safe temporary bootstrap path.' >&2
            exit 78
          }
          cleanup_remote_bootstrap_file() {
            ssh "${ssh_args[@]}" "$target" "rm -f -- '$bootstrap_script'" >/dev/null 2>&1 || true
          }
          trap cleanup_remote_bootstrap_file EXIT
          scp "${ssh_args[@]}" scripts/deployment/bootstrap-production-directories.mjs "$target:$bootstrap_script"

          image="$IMAGE_REF"
          remote_command="set -Eeuo pipefail; umask 077; bootstrap_file='$bootstrap_script'; export DOCKER_CONFIG=\$(mktemp -d /tmp/lunidex-production-bootstrap-docker.XXXXXX); trap 'rm -f \"\$bootstrap_file\"; rm -rf \"\$DOCKER_CONFIG\"' EXIT; if ! docker info >/dev/null 2>&1; then echo 'lunidex-deploy must have access to the Docker daemon to prepare the production directory.' >&2; exit 77; fi; docker login ghcr.io --username teefloo --password-stdin; image='$image'; docker pull \"\$image\"; target_uid=\$(id -u); target_gid=\$(id -g); docker run --rm --network none --read-only --userns=host --user 0:0 --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --mount type=bind,source=/opt,target=/host/opt --mount type=bind,source=\$bootstrap_file,target=/bootstrap-production-directories.mjs,readonly --env BOOTSTRAP_ROOT=/host/opt/lunidex-production --env BOOTSTRAP_UID=\$target_uid --env BOOTSTRAP_GID=\$target_gid --entrypoint node \"\$image\" /bootstrap-production-directories.mjs"
          printf '%s' "$GITHUB_TOKEN" | ssh "${ssh_args[@]}" "$target" "$remote_command"

      - name: Prune dangling images for production deploys
        if: inputs.deployment_mode == 'deploy'
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$OVH_PRODUCTION_DEPLOY_USER@$OVH_PRODUCTION_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=4)
          remote_command="set -Eeuo pipefail; if docker image prune --force --filter dangling=true >/dev/null 2>&1; then printf '%s\\n' 'dangling_images_pruned=true'; else printf '%s\\n' 'dangling_images_pruned=false' >&2; exit 1; fi"
          timeout 90s ssh "${ssh_args[@]}" "$target" "$remote_command"

      - name: Transfer isolated production files and environment
        if: inputs.deployment_mode == 'deploy'
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$OVH_PRODUCTION_DEPLOY_USER@$OVH_PRODUCTION_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" "$target" 'set -Eeuo pipefail; root=/opt/lunidex-production; install -d -m 0755 "$root/scripts/deployment" "$root/deploy/production" "$root/deploy/systemd-production"; if [[ ! -f "$root/.env" ]]; then umask 077; printf "%s\n" "APP_IMAGE_REF=ghcr.io/teefloo/lunidex@sha256:9ca8f66d0b5f79a984358d12fe1c382319df7364388ec2d5df78fe3c5afc318a" > "$root/.env"; fi; chmod 0600 "$root/.env"'
          scp "${ssh_args[@]}" compose.production.yaml "$target:/opt/lunidex-production/"
          scp "${ssh_args[@]}" scripts/deployment/deploy-production.sh scripts/deployment/rollback-production.sh scripts/deployment/healthcheck-production.sh scripts/deployment/check-neon-production.sh scripts/deployment/preflight-production.sh scripts/deployment/rehearse-rollback-production.sh scripts/deployment/production-memory-gate.sh "$target:/opt/lunidex-production/scripts/deployment/"
          scp "${ssh_args[@]}" scripts/deployment/activate-production-route.sh "$target:/opt/lunidex-production/scripts/deployment/"
          scp "${ssh_args[@]}" deploy/production/* "$target:/opt/lunidex-production/deploy/production/"
          scp "${ssh_args[@]}" deploy/systemd-production/* "$target:/opt/lunidex-production/deploy/systemd-production/"
          scp "${ssh_args[@]}" "$RUNNER_TEMP/lunidex-production-app.env" "$target:/opt/lunidex-production/app.env.$PRODUCTION_COMMIT.tmp"
          ssh "${ssh_args[@]}" "$target" "chmod 0600 /opt/lunidex-production/app.env.$PRODUCTION_COMMIT.tmp && mv /opt/lunidex-production/app.env.$PRODUCTION_COMMIT.tmp /opt/lunidex-production/app.env"

      - name: Stop preproduction before durable production deployment
        if: inputs.deployment_mode == 'deploy'
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$OVH_PRODUCTION_DEPLOY_USER@$OVH_PRODUCTION_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=4)
          timeout 60s ssh "${ssh_args[@]}" "$target" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          running="$(docker inspect --format '{{.State.Running}}' lunidex-app 2>/dev/null)" || {
            echo 'Could not inspect the preproduction app container; refusing production start.' >&2
            exit 1
          }
          case "$running" in
            true) docker stop --time 30 lunidex-app >/dev/null ;;
            false) ;;
            *) echo 'Unexpected preproduction container state; refusing production start.' >&2; exit 1 ;;
          esac
          running="$(docker inspect --format '{{.State.Running}}' lunidex-app 2>/dev/null)" || {
            echo 'Could not verify the preproduction app state; refusing production start.' >&2
            exit 1
          }
          if [[ "$running" != false ]]; then
            echo 'The preproduction app is still running; refusing production start.' >&2
            exit 1
          fi
          echo 'Preproduction app is stopped before durable production deployment.'
          REMOTE

      - name: Deploy or privately preflight the production image
        if: inputs.deployment_mode == 'deploy'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ steps.candidate_image.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          target="$OVH_PRODUCTION_DEPLOY_USER@$OVH_PRODUCTION_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote_command="set -Eeuo pipefail; umask 077; export DOCKER_CONFIG=\$(mktemp -d /tmp/lunidex-production-docker.XXXXXX); trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT; docker login ghcr.io --username teefloo --password-stdin; bash /opt/lunidex-production/scripts/deployment/deploy-production.sh '$IMAGE_REF' '$PRODUCTION_COMMIT' deploy"
          printf '%s' "$GITHUB_TOKEN" | ssh "${ssh_args[@]}" "$target" "$remote_command"

      - name: Verify the production deployment health
        if: success() && inputs.deployment_mode == 'deploy'
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$OVH_PRODUCTION_DEPLOY_USER@$OVH_PRODUCTION_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=4)
          timeout 90s ssh "${ssh_args[@]}" "$target" 'bash /opt/lunidex-production/scripts/deployment/healthcheck-production.sh'

      - name: Probe Neon Auth separately from application health
        if: success() && inputs.deployment_mode == 'deploy'
        id: neon_auth_probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$OVH_PRODUCTION_DEPLOY_USER@$OVH_PRODUCTION_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=4)
          timeout 45s ssh "${ssh_args[@]}" "$target" \
            'bash /opt/lunidex-production/scripts/deployment/check-neon-production.sh https://lunidex.app/api/auth/get-session'

      - name: Report Neon availability independently of Node health
        if: always() && inputs.deployment_mode == 'deploy'
        shell: bash
        env:
          NEON_PROBE_OUTCOME: ${{ steps.neon_auth_probe.outcome }}
        run: |
          set -Eeuo pipefail
          {
            echo '## Separate application and provider outcomes'
            echo
            echo '- The Docker health check and local /api/healthz response measure the Lunidex process only.'
            if [[ "$NEON_PROBE_OUTCOME" == 'success' ]]; then
              echo '- Neon Auth session endpoint responded. This unauthenticated probe confirms reachability only; it does not claim that a signed-in session works.'
            else
              echo '- **Neon Auth functional availability: NO-GO.** The provider probe failed, including HTTP 402 quota exhaustion. This does not change the Node/container health verdict and does not cause an app rollback.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retrieve optional sanitized heap allocation summary
        if: success() && inputs.deployment_mode == 'deploy' && inputs.heap_sampling_diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$OVH_PRODUCTION_DEPLOY_USER@$OVH_PRODUCTION_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=4)
          [[ "$HEAP_SAMPLING_RUN_ID" =~ ^[0-9]+-[0-9]+$ ]]
          expected_prefix="LUNIDEX_HEAP_SAMPLE_SUMMARY_${HEAP_SAMPLING_RUN_ID}="
          remote_command="EXPECTED_SUMMARY_PREFIX='$expected_prefix' bash -s"
          safe_summary_line="$(timeout 980s ssh "${ssh_args[@]}" "$target" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          [[ "${EXPECTED_SUMMARY_PREFIX:-}" =~ ^LUNIDEX_HEAP_SAMPLE_SUMMARY_[0-9]+-[0-9]+=$ ]]
          for ((attempt = 0; attempt < 95; attempt += 1)); do
            safe_summary="$(docker logs --since 20m --tail 5000 lunidex-production-app 2>/dev/null \
              | awk -v prefix="$EXPECTED_SUMMARY_PREFIX" 'length($0) <= 16384 && index($0, prefix) == 1 { summary = $0 } END { if (summary != "") print summary }' \
              || true)"
            if [[ -n "$safe_summary" ]]; then
              printf '%s\n' "$safe_summary"
              exit 0
            fi
            sleep 10
          done
          exit 78
          REMOTE
          )"
          printf '%s\n' "$safe_summary_line" | node scripts/deployment/validate-heap-sample-summary.mjs "$HEAP_SAMPLING_RUN_ID"

      - name: Retrieve the exact-run sanitized heap memory series
        if: success() && inputs.deployment_mode == 'deploy' && inputs.heap_sampling_diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$OVH_PRODUCTION_DEPLOY_USER@$OVH_PRODUCTION_DEPLOY_HOST"
          ssh_args=(-i "$HOME/.ssh/ovh_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=4)
          [[ "$HEAP_SAMPLING_RUN_ID" =~ ^[0-9]+-[0-9]+$ ]]
          expected_prefix="LUNIDEX_HEAP_MEMORY_POINT_${HEAP_SAMPLING_RUN_ID}="
          remote_command="EXPECTED_MEMORY_POINT_PREFIX='$expected_prefix' bash -s"
          safe_memory_points="$(timeout 90s ssh "${ssh_args[@]}" "$target" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          [[ "${EXPECTED_MEMORY_POINT_PREFIX:-}" =~ ^LUNIDEX_HEAP_MEMORY_POINT_[0-9]+-[0-9]+=$ ]]
          docker logs --since 24h --tail 50000 lunidex-production-app 2>/dev/null \
            | awk -v prefix="$EXPECTED_MEMORY_POINT_PREFIX" 'length($0) <= 512 && index($0, prefix) == 1 { print }' \
            || true
          REMOTE
          )"
          printf '%s\n' "$safe_memory_points" \
            | node scripts/deployment/validate-heap-sample-summary.mjs --memory-series "$HEAP_SAMPLING_RUN_ID"

      - name: Report isolated preflight boundary
        if: success() && inputs.deployment_mode == 'preflight'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.candidate_image.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          {
            echo '## Isolated preflight complete'
            echo
            echo 'The candidate and rollback were built or pulled, checked by digest, and smoke-tested on this GitHub runner.'
            echo 'No SSH key was configured; no VPS, production environment file, container, Caddy route, or Neon data was accessed.'
            echo "Candidate: \`$IMAGE_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary secrets and SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/ovh_deploy" "$RUNNER_TEMP/lunidex-production-app.env"
