name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: node --test scripts/deployment/bootstrap-production-directories.test.mjs

      - run: node --test scripts/deployment/validate-heap-sample-summary.test.mjs

      - run: npm run seo:check

      - run: npm run build

      - run: node scripts/ci/smoke-standalone.mjs

      - run: npx tsc --project packages/core/tsconfig.json --noEmit
