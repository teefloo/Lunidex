name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        run: npx --yes supabase@3.4.0 --version

      - name: Start isolated local database and Auth
        run: >-
          npx --yes supabase@3.4.0 start
          --exclude realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply local schema migrations
        run: npx --yes supabase@3.4.0 migration up

      - name: Run local pgTAP security tests
        run: npx --yes supabase@3.4.0 test db

      - name: Stop local Supabase containers
        if: always()
        run: npx --yes supabase@3.4.0 stop --no-backup

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: node --test scripts/deployment/bootstrap-production-directories.test.mjs

      - run: node --test scripts/deployment/validate-heap-sample-summary.test.mjs

      - run: node --test scripts/deployment/production-memory-gate.test.mjs

      - name: Verify OVH production deployment automation safeguards
        run: node --test scripts/deployment/production-deploy-safety.test.mjs

      - name: Verify OVH audit diagnostics and stability reports
        run: python3 -m unittest discover -s scripts/deployment -p 'test_*ovh*.py'

      - name: Verify isolated heap diagnostic under Node 22
        run: >-
          node --test
          scripts/deployment/isolated-tcg-rsc-load.test.mjs
          scripts/deployment/classify-isolated-node-logs.test.mjs
          scripts/deployment/normalize-isolated-container-state.test.mjs
          scripts/deployment/normalize-isolated-container-stats.test.mjs
          scripts/deployment/classify-isolated-docker-launch-error.test.mjs
          scripts/deployment/isolated-tcg-egress-proxy.test.mjs
          scripts/deployment/warm-isolated-diagnostic-route.test.mjs

      - run: node --test scripts/patch-next-control-flow-errors.test.mjs

      - run: npm run seo:check

      - run: npm run build

      - run: node scripts/ci/smoke-standalone.mjs

      - run: npx tsc --project packages/core/tsconfig.json --noEmit
