name: lunidex-production

services:
  app:
    image: ghcr.io/teefloo/lunidex:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to an immutable Git SHA}
    container_name: lunidex-production-app
    restart: unless-stopped
    init: true
    env_file:
      - ./app.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=768
    expose:
      - "3000"
    networks:
      - backend
      - egress
    volumes:
      - next-cache:/app/.next/cache
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1280m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  backend:
    external: true
    name: lunidex_backend
  egress:
    external: true
    name: lunidex_egress

volumes:
  next-cache:
    name: lunidex-production-next-cache
